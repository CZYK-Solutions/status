# Maintenance page shown by the reverse proxy while a deploy is in progress.
#
# Lives in Nginx Proxy Manager (custom Nginx configuration on the
# packathing.nl proxy host), not in application code — kept here only as a
# tracked copy so it isn't the one config that exists nowhere in git.
#
# The `=503` matters and isn't optional decoration: without it, nginx keeps
# the *original* upstream status (502 Bad Gateway / 504 Gateway Timeout) on
# the response even though @deploying below does `return 503 ...` — the
# error_page redirect only rewrites the body unless told to override the
# code too. Cloudflare's edge treats 502/504 as "origin unreachable" and
# replaces them with its own generic error page regardless of body content;
# 503 is the one status it leaves alone and relays as-is. Forcing all three
# to `=503` is what actually gets this custom page shown through Cloudflare
# instead of Cloudflare's own.

error_page 502 503 504 =503 @deploying;

location @deploying {
    default_type text/html;
    add_header Retry-After 30 always;
    return 503 '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Back in a moment</title><style>:root{color-scheme:light dark}body{font:16px/1.6 system-ui,-apple-system,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;background:#f8fafc;color:#334155}@media(prefers-color-scheme:dark){body{background:#0f172a;color:#cbd5e1}}main{max-width:26rem;text-align:center}h1{font-size:1.4rem;font-weight:600;margin:0 0 .75rem}p{margin:0 0 1rem;color:#64748b}@media(prefers-color-scheme:dark){p{color:#94a3b8}}a{color:inherit}</style><main><h1>Back in a moment</h1><p>We are rolling out a new version of Pack a Thing. Refresh in a few seconds and you will be right back where you were.</p><p><a href="https://status.packathing.nl">Check status.packathing.nl</a></p></main>';
}
